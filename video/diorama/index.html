<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MiceMax diorama</title>
<style>
  @font-face { font-family: Fredoka; src: url(../shared/fonts/Fredoka.ttf); font-weight: 300 700; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #dfeaf3; }
  canvas { position: absolute; inset: 0; width: 1920px !important; height: 1080px !important; }
  #head { position: absolute; left: 0; right: 0; top: 58px; text-align: center; font: 600 112px/1.08 Fredoka, sans-serif;

  #head span { display: inline-block; white-space: pre; }
  #head.light { color: #fff; text-shadow: 0 4px 30px rgba(30, 30, 80, 0.35); }
  #logo { position: absolute; left: 0; right: 0; top: 0; bottom: 120px; display: flex; align-items: center; justify-content: center; gap: 44px; opacity: 0; }
  #logo img { width: 230px; height: 230px; }
  #logo b { font: 600 220px/1 Fredoka, sans-serif; color: #fff; letter-spacing: -0.02em; text-shadow: 0 6px 40px rgba(30, 30, 80, 0.3); }
  #logo img { filter: drop-shadow(0 6px 30px rgba(30, 30, 80, 0.3)); }
</style>

<div id="head"></div>
<div id="logo"><img src="logo.svg" alt=""><b>MiceMax</b></div>
